name: Auto Deploy YAMCqrs Packages

on:
  push:
    branches:
      - main

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 1. Extraer versión centralizada
      - name: Extract Version
        id: get_version
        run: |
          TARGETS_FILE="./src/Directory.Build.targets"
                  
          if [ ! -f "$TARGETS_FILE" ]; then
            echo "No se encontró $TARGETS_FILE"
            exit 1
          fi
                  
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "$TARGETS_FILE" || \
          grep -oPm1 '(?<=<VersionPrefix>)[^<]+' "$TARGETS_FILE")
                  
          if [ -z "$VERSION" ]; then
            echo "No se pudo detectar la versión."
            exit 1
          fi
                  
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
                  
          echo "## 📦 Version Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Targets File: \`$TARGETS_FILE\`" >> $GITHUB_STEP_SUMMARY
          echo "- Detected Version: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY

      # 2. Verificar si la versión ya existe en NuGet.org
      - name: Check if Version Exists on NuGet.org
        id: check_nuget
        run: |
          PACKAGE_TEST="YAMCqrs.Core"

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.nuget.org/v3-flatcontainer/${PACKAGE_TEST,,}/${{ steps.get_version.outputs.current_version }}/index.json)

          if [ "$STATUS_CODE" = "200" ]; then
            echo "skip_deploy=true" >> $GITHUB_OUTPUT

            echo "## ⏭ Deployment Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Version \`${{ steps.get_version.outputs.current_version }}\` already exists on NuGet.org." >> $GITHUB_STEP_SUMMARY
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT

            echo "## 🚀 New Deployment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Publishing version \`${{ steps.get_version.outputs.current_version }}\` to NuGet.org." >> $GITHUB_STEP_SUMMARY
          fi

      # 3. Validar API Key
      - name: Validate NuGet API Key
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "NUGET_API_KEY no configurada"
            exit 1
          fi

      # 4. Restaurar dependencias
      - name: Restore Dependencies
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: dotnet restore ./src/solution.slnx

      # 5. Ejecutar tests
      - name: Run Tests
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: dotnet test ./src/solution.slnx --configuration Release --no-restore

      - name: Test Summary
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: |
          echo "## 🧪 Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY

      # 6. Generar paquetes usando script local
      - name: Pack Packages using Local Script
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        shell: pwsh
        run: |
          ./dev.scripts/nuget-local-package.ps1

      - name: Package Summary
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: |
          echo "## 📦 Package Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- NuGet packages generated successfully." >> $GITHUB_STEP_SUMMARY

      # =====================================================
      # NUGET LOGIN (OIDC)
      # =====================================================

      - name: NuGet Login
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        uses: NuGet/login@v1
        id: login
        with:
          user: JulianCamits
      # =====================================================
      # PUBLISH
      # =====================================================

      - name: Publish To NuGet
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        env:
          NUGET_EXPERIMENTAL_CHAIN_BUILD_RETRY_POLICY: 9,1000
        run: |
          dotnet nuget push "./nugets/*.nupkg" \
            --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish Summary
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: |
          echo "## 🚀 NuGet Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Packages published successfully." >> $GITHUB_STEP_SUMMARY
          echo "- Symbols (.snupkg) included for SourceLink debugging." >> $GITHUB_STEP_SUMMARY

      # 8. Crear tag Git
      - name: Create Git Tag
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.get_version.outputs.current_version }}$"; then
            echo "El tag ya existe."
          else
            git tag "v${{ steps.get_version.outputs.current_version }}"
            git push origin "v${{ steps.get_version.outputs.current_version }}"
            echo "Tag creado correctamente."
          fi

      - name: Tag Summary
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: |
          echo "## 🏷 Git Tag" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Created tag: \`v${{ steps.get_version.outputs.current_version }}\`" >> $GITHUB_STEP_SUMMARY

      # 9. Workflow final summary
      - name: Final Summary
        if: steps.check_nuget.outputs.skip_deploy == 'false'
        run: |
          echo "## ✅ Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version Detection | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| NuGet Validation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Restore | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Packaging | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| NuGet Publish | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Tag | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📌 Published Version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.get_version.outputs.current_version }}\`" >> $GITHUB_STEP_SUMMARY
